<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Warm high school library in the afternoon">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c5138"/>
      <stop offset="1" stop-color="#573526"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5738"/>
      <stop offset="1" stop-color="#5f3826"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe1af"/>
      <stop offset=".55" stop-color="#ffc38a"/>
      <stop offset="1" stop-color="#f5a071"/>
    </linearGradient>
    <linearGradient id="beam" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffeec1" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffdda0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a86e47"/>
      <stop offset="1" stop-color="#7c4a30"/>
    </linearGradient>
    <pattern id="booksA" width="140" height="120" patternUnits="userSpaceOnUse">
      <rect width="140" height="120" fill="#3a2622"/>
      <rect x="5" y="12" width="13" height="104" fill="#b85f4c"/>
      <rect x="21" y="20" width="10" height="96" fill="#d39a5e"/>
      <rect x="34" y="8" width="15" height="108" fill="#6f8b6a"/>
      <rect x="52" y="26" width="9" height="90" fill="#8b6a9d"/>
      <rect x="64" y="14" width="14" height="102" fill="#c4775a"/>
      <rect x="81" y="30" width="11" height="86" fill="#5f7f8f"/>
      <rect x="95" y="10" width="13" height="106" fill="#d0b078"/>
      <rect x="111" y="22" width="9" height="94" fill="#9b5d6f"/>
      <rect x="123" y="16" width="12" height="100" fill="#6a7b52"/>
      <rect x="18" y="94" width="70" height="8" rx="2" fill="#c9a06b" transform="rotate(-4 18 94)"/>
    </pattern>
    <pattern id="booksB" width="130" height="120" patternUnits="userSpaceOnUse">
      <rect width="130" height="120" fill="#3b2723"/>
      <rect x="4" y="18" width="11" height="98" fill="#9f5a45"/>
      <rect x="18" y="8" width="14" height="108" fill="#cfa267"/>
      <rect x="35" y="24" width="9" height="92" fill="#7a8d9a"/>
      <rect x="47" y="12" width="12" height="104" fill="#b37786"/>
      <rect x="62" y="28" width="10" height="88" fill="#6f8058"/>
      <rect x="75" y="6" width="15" height="110" fill="#c8694f"/>
      <rect x="93" y="20" width="9" height="96" fill="#8a6b9c"/>
      <rect x="105" y="14" width="13" height="102" fill="#d8b984"/>
      <rect x="31" y="98" width="58" height="7" rx="2" fill="#b98f5f" transform="rotate(3 31 98)"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffdf9d" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffbf6e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#wall)"/>
  <rect y="780" width="1920" height="300" fill="url(#floor)"/>
  <path d="M0 780 H1920" stroke="#4e2d20" stroke-width="6" opacity=".6"/>
  <g stroke="#4a2b1f" stroke-width="2" opacity=".25">
    <path d="M0 870 H1920"/>
    <path d="M0 960 H1920"/>
    <path d="M0 1050 H1920"/>
    <path d="M260 780 L200 1080"/>
    <path d="M620 780 L600 1080"/>
    <path d="M980 780 L1000 1080"/>
    <path d="M1340 780 L1400 1080"/>
    <path d="M1700 780 L1800 1080"/>
  </g>

  <!-- ceiling beams -->
  <g fill="#4b2e22" opacity=".85">
    <rect width="1920" height="44"/>
    <rect x="240" y="44" width="26" height="70"/>
    <rect x="760" y="44" width="26" height="70"/>
    <rect x="1280" y="44" width="26" height="70"/>
    <rect x="1780" y="44" width="26" height="70"/>
  </g>

  <!-- big bookshelf left -->
  <g>
    <rect x="50" y="110" width="1080" height="680" rx="8" fill="#3b241c"/>
    <rect x="72" y="132" width="1036" height="636" fill="#4a2d22"/>
    <g>
      <rect x="84" y="144" width="1012" height="130" fill="url(#booksA)"/>
      <rect x="84" y="290" width="1012" height="130" fill="url(#booksB)"/>
      <rect x="84" y="436" width="1012" height="130" fill="url(#booksA)"/>
      <rect x="84" y="582" width="1012" height="168" fill="url(#booksB)"/>
    </g>
    <g fill="#5c3728">
      <rect x="72" y="274" width="1036" height="16"/>
      <rect x="72" y="420" width="1036" height="16"/>
      <rect x="72" y="566" width="1036" height="16"/>
      <rect x="72" y="750" width="1036" height="18"/>
    </g>
    <g fill="#6b4230">
      <rect x="72" y="132" width="18" height="636"/>
      <rect x="1090" y="132" width="18" height="636"/>
      <rect x="340" y="132" width="12" height="636" opacity=".8"/>
      <rect x="650" y="132" width="12" height="636" opacity=".8"/>
      <rect x="920" y="132" width="12" height="636" opacity=".8"/>
    </g>
  </g>

  <!-- small bookshelf right -->
  <g>
    <rect x="1160" y="160" width="300" height="620" rx="6" fill="#3b241c"/>
    <rect x="1178" y="178" width="264" height="584" fill="#4a2d22"/>
    <rect x="1190" y="190" width="240" height="130" fill="url(#booksB)"/>
    <rect x="1190" y="336" width="240" height="130" fill="url(#booksA)"/>
    <rect x="1190" y="482" width="240" height="130" fill="url(#booksB)"/>
    <rect x="1190" y="628" width="240" height="120" fill="url(#booksA)"/>
    <g fill="#5c3728">
      <rect x="1178" y="320" width="264" height="16"/>
      <rect x="1178" y="466" width="264" height="16"/>
      <rect x="1178" y="612" width="264" height="16"/>
    </g>
  </g>

  <!-- arched window -->
  <g>
    <path d="M1510 780 V320 Q1510 140 1665 140 Q1820 140 1820 320 V780 Z" fill="#6b4330"/>
    <path d="M1530 762 V330 Q1530 166 1665 166 Q1800 166 1800 330 V762 Z" fill="url(#sky)"/>
    <g fill="#b57955" opacity=".55">
      <circle cx="1590" cy="520" r="86"/>
      <circle cx="1700" cy="480" r="100"/>
      <circle cx="1780" cy="580" r="74"/>
      <circle cx="1630" cy="650" r="68"/>
    </g>
    <g stroke="#6b4330" stroke-width="12">
      <path d="M1665 166 V762"/>
      <path d="M1530 400 H1800"/>
      <path d="M1530 580 H1800"/>
    </g>
    <g fill="#ffe7b8" opacity=".4">
      <circle cx="1580" cy="300" r="4"/>
      <circle cx="1720" cy="260" r="5"/>
      <circle cx="1770" cy="360" r="3"/>
    </g>
  </g>

  <!-- sunbeams -->
  <g opacity=".5">
    <polygon points="1560,230 1740,230 1160,880 760,980" fill="url(#beam)"/>
    <polygon points="1620,260 1800,260 1500,920 1180,980" fill="url(#beam)" opacity=".7"/>
  </g>
  <ellipse cx="1200" cy="880" rx="420" ry="100" fill="#ffdda0" opacity=".14" filter="url(#soft)"/>

  <!-- pendant lights -->
  <g>
    <path d="M560 0 V190" stroke="#3b241c" stroke-width="4"/>
    <path d="M500 250 Q560 190 620 250 Z" fill="#d9a05d"/>
    <ellipse cx="560" cy="250" rx="62" ry="12" fill="#efc07e"/>
    <circle cx="560" cy="290" r="70" fill="url(#lamp)"/>
    <path d="M960 0 V160" stroke="#3b241c" stroke-width="4"/>
    <path d="M900 220 Q960 160 1020 220 Z" fill="#d9a05d"/>
    <ellipse cx="960" cy="220" rx="62" ry="12" fill="#efc07e"/>
    <circle cx="960" cy="260" r="70" fill="url(#lamp)"/>
    <path d="M1380 0 V180" stroke="#3b241c" stroke-width="4"/>
    <path d="M1320 240 Q1380 180 1440 240 Z" fill="#d9a05d"/>
    <ellipse cx="1380" cy="240" rx="62" ry="12" fill="#efc07e"/>
    <circle cx="1380" cy="280" r="70" fill="url(#lamp)"/>
  </g>

  <!-- reading table -->
  <g>
    <path d="M470 800 L1260 780 L1320 890 L510 914 Z" fill="#a56a45"/>
    <path d="M510 914 L1320 890 L1320 982 L510 1008 Z" fill="#7d4a31"/>
    <rect x="540" y="1008" width="34" height="72" fill="#5c3524"/>
    <rect x="1230" y="982" width="34" height="72" fill="#5c3524"/>
    <path d="M600 830 L760 824 L790 870 L620 878 Z" fill="#f0e2c5"/>
    <path d="M780 818 L930 812 L960 858 L800 866 Z" fill="#e3c9a5"/>
    <path d="M610 836 L750 831" stroke="#b08e6e" stroke-width="3" opacity=".7"/>
    <path d="M630 850 L748 845" stroke="#b08e6e" stroke-width="3" opacity=".7"/>
    <rect x="1020" y="810" width="54" height="12" rx="4" fill="#d6566b" transform="rotate(-4 1020 810)"/>
    <rect x="1040" y="826" width="36" height="9" rx="4" fill="#6a8a72" transform="rotate(2 1040 826)"/>
    <g transform="translate(930 780) scale(.7)">
      <rect x="0" y="30" width="120" height="10" rx="5" fill="#4a2d22"/>
      <path d="M10 40 L70 40 L90 120 L30 120 Z" fill="#f2d7a0"/>
      <circle cx="55" cy="18" r="30" fill="#f2d7a0"/>
      <path d="M25 30 Q55 -6 85 30" fill="#e7c48c"/>
    </g>
  </g>

  <!-- chairs -->
  <g fill="#6f422d">
    <path d="M400 860 L480 850 L500 970 L420 980 Z"/>
    <rect x="410" y="770" width="80" height="90" rx="10" fill="#7d4b32"/>
    <path d="M1350 830 L1460 820 L1480 950 L1370 960 Z"/>
    <rect x="1360" y="740" width="90" height="90" rx="10" fill="#7d4b32"/>
  </g>

  <!-- returns cart -->
  <g>
    <rect x="1010" y="650" width="180" height="14" rx="4" fill="#6d4530"/>
    <rect x="1022" y="708" width="156" height="12" rx="4" fill="#6d4530"/>
    <rect x="1018" y="664" width="10" height="116" fill="#50301f"/>
    <rect x="1172" y="664" width="10" height="116" fill="#50301f"/>
    <rect x="1030" y="620" width="70" height="34" rx="3" fill="#c26450"/>
    <rect x="1090" y="612" width="58" height="42" rx="3" fill="#7f8f5d"/>
    <rect x="1060" y="682" width="66" height="30" rx="3" fill="#cfa367"/>
    <circle cx="1028" cy="790" r="12" fill="#3b241c"/>
    <circle cx="1178" cy="790" r="12" fill="#3b241c"/>
  </g>

  <!-- dust motes -->
  <g fill="#ffe9bd">
    <circle cx="760" cy="320" r="4" opacity=".7"/>
    <circle cx="880" cy="420" r="3" opacity=".5"/>
    <circle cx="1080" cy="300" r="3.5" opacity=".6"/>
    <circle cx="1240" cy="500" r="4" opacity=".5"/>
    <circle cx="1420" cy="380" r="3" opacity=".65"/>
    <circle cx="620" cy="560" r="3" opacity=".45"/>
    <circle cx="1580" cy="620" r="4" opacity=".5"/>
    <circle cx="1720" cy="450" r="3" opacity=".45"/>
    <circle cx="960" cy="700" r="3" opacity=".4"/>
  </g>

  <!-- floor books stack foreground -->
  <g transform="translate(90 880)">
    <rect x="0" y="90" width="170" height="20" rx="3" fill="#b85f4c"/>
    <rect x="12" y="70" width="150" height="18" rx="3" fill="#cfa367"/>
    <rect x="4" y="50" width="160" height="18" rx="3" fill="#6f8b6a"/>
    <rect x="18" y="30" width="140" height="18" rx="3" fill="#8b6a9d"/>
  </g>

  <rect width="1920" height="1080" fill="#ffae66" opacity=".06"/>
</svg>
